  month: 9
  year: 2026
  title: "Toward Reliable Language Models: Structure-Aware Learning on Computational Traces"
  kind: Invited Talk
  venue: "CIRM Workhops – Machine Learning and Signal Processing on Graphs"
  slides: "https://docs.google.com/presentation/d/e/2PACX-1vQFUJYNVafsJ4CRgKfpEgsoYeiZh_yYgpukmaJkbfJ_uOtQhgMWu6_ekAmdrT6x4bDvm2pJgRGBtO5v/pub?start=false&loop=false&delayms=3000"
  tldr: "LLM failure detectors mostly rely on simplistic linear models and handcrafted heuristics applied to hand-picked fragments of model internals. We argue that these 'computational traces' — such as activations, next-token distributions, and attention maps — are structured data modalities that deserve being processed by architectures with inductive biase matched to their structure, in the spirit of Geometric Deep Learning. In this talk I present a series of five works on hallucination detection, where we describe architectures to optimally process these computational traces, with a focus on employing attention-induced graphs and neural message-passing thereon as a flexibile, unifying approach. The resulting monitors are lightweight, outperform probing and heuristic baselines, and show promising transfer capabilities across tasks and LLMs."
  link: https://conferences.cirm-math.fr/3653.html
  works:
    - https://arxiv.org/abs/2503.14043
    - https://arxiv.org/abs/2510.00296
    - https://arxiv.org/abs/2509.24770
    - (work whose preprint will be released soon)
    - https://arxiv.org/abs/2608.10835
