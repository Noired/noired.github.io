{% for new in site.data.news limit:5 %}
<div style="display:flex;gap:14px;margin-bottom:20px">
	<span style="flex:0 0 4.5em;color:#777;font-variant-numeric:tabular-nums">
		{{new.year}}/{{ new.month | prepend: '0' | slice: -2, 2 }}
	</span>
	<span>{{new.text}}</span>
</div>
{% endfor %}

<p style="font-size:12px;margin-top:5px;margin-bottom:5px">
	<a href="{{ "/time" | relative_url }}">See all news &rarr;</a>
</p>
